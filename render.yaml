services:
  - type: web
    name: phantomtrace-demo
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: META_MODEL
        value: muse-spark-1.3
      - key: DEMO_USERNAME
        value: demo
      - key: DEMO_PASSWORD
        generateValue: true
